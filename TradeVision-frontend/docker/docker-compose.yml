# =============================================================
# docker-compose.yml — CSE Stock Prediction Frontend
# =============================================================
# Usage:
#   Development (hot-reload):   docker compose up
#   Production (nginx bundle):  docker compose --profile prod up
# =============================================================

name: tradevision-frontend

services:
  # -----------------------------------------------------------------
  # Dev service — Vite hot-reload dev server on localhost:5173
  # -----------------------------------------------------------------
  frontend-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev              # Uses Stage 1 of the multi-stage build
    container_name: trade-vision-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      # Mount source code so edits on the host reflect instantly
      - ..:/app
      # Preserve the container's node_modules to avoid host/container conflicts
      - /app/node_modules
    environment:
      - NODE_ENV=development
    # VITE_API_URL is not listed here on purpose. The `..:/app` mount above puts
    # TradeVision-frontend/.env at /app/.env, which is Vite's own native location,
    # so the dev server reads it straight from there — the same single file a host
    # `npm run dev` uses.
    restart: unless-stopped

  # -----------------------------------------------------------------
  # Prod service — compiled bundle served by nginx on localhost:80
  # Only starts when you pass --profile prod
  # -----------------------------------------------------------------
  frontend-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: prod             # Uses Stage 3 of the multi-stage build
      args:
        # Baked into the bundle at build time — see the ARG note in the Dockerfile.
        #
        # Unlike frontend-dev, this does NOT pick up TradeVision-frontend/.env by
        # itself: build args come from Compose interpolation, which only reads the
        # host shell or an explicit --env-file. To build against the very same file
        # the dev server uses, run this from TradeVision-frontend/:
        #
        #   docker compose -f docker/docker-compose.yml --env-file .env \
        #     --profile prod up --build
        #
        # Note --env-file resolves against your shell's directory, not against this
        # compose file — so it is `.env`, not `../.env`, from the stack root.
        #
        # Or for a one-off target:
        #   VITE_API_URL=https://api.example.com docker compose ... up --build
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: trade-vision-frontend-prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    profiles:
      - prod
