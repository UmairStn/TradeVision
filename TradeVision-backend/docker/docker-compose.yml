# =============================================================
# docker-compose.yml — CSE Stock Prediction Backend
# =============================================================
# Usage:
#   Development (hot-reload):   docker compose -f docker/docker-compose.yml up -d backend-dev
#   Production (standard):     docker compose -f docker/docker-compose.yml --profile prod up -d backend-prod
# =============================================================

name: tradevision-backend

services:
  # -----------------------------------------------------------------
  # Dev service — Uvicorn hot-reload dev server on localhost:8000
  # -----------------------------------------------------------------
  backend-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev              # Uses Stage 1 of the multi-stage build
    container_name: trade-vision-backend-dev
    ports:
      - "8000:8000"
    volumes:
      # Mount source code so edits on the host reflect instantly
      - ..:/app
      # Mount Hugging Face cache so model files survive container rebuilds!
      - hf_cache:/root/.cache/huggingface
    environment:
      - NODE_ENV=development
      - PYTHONPATH=/app
    restart: unless-stopped

  # -----------------------------------------------------------------
  # Prod service — standard Uvicorn server on localhost:8000
  # Only starts when you pass --profile prod
  # -----------------------------------------------------------------
  backend-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: prod             # Uses Stage 2 of the multi-stage build
    container_name: trade-vision-backend-prod
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PYTHONPATH=/app
    restart: unless-stopped
    profiles:
      - prod

# -----------------------------------------------------------------
# Named Volumes (Required for hf_cache to persist Hugging Face models)
# -----------------------------------------------------------------
volumes:
  hf_cache: